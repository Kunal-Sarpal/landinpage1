<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.6.0/fonts/remixicon.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
        }
        .box {
            display: grid;
            width: 100%;
            height: 100%;
            grid-template-columns: 25% 25% 50%;
            grid-template-rows: 26% 56% 18%;
        }
        .left-top-left, .left-top-right, .left-center, .left-bottom, .right {
            padding: 40px;
        }
        .left-top-right {
            text-align: right;
        }
        .left-center h1 {
            font-size: 5.8vw;
            text-transform: uppercase;
            font-weight: 100;
        }
        .right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        .menu-list {
            list-style: none;
            padding: 0;
        }
        .menu-list li {
            margin: 5px 0;
        }
        .menu-list a {
            text-decoration: none;
            color: #333;
            font-size: 18px;
            font-weight: 500;
        }
        .menu-list a:hover {
            color: orange;
        }
        #arrow {
            position: absolute;
            top: 50%;
            left: 90%;
            transform: translate(-50%, -50%);
            background: orange;
            color: white;
            padding: 15px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="left-top-left">
            <div id="square"></div>
        </div>
        <div class="left-top-right">
            <ul class="menu-list" id="menuList"></ul>
        </div>
        <div class="left-center">
            <h1>Select</h1>
            <h1>Cars</h1>
            <h1 id="h11">Mod.05</h1>
            <h1>Scene</h1>
        </div>
        <div class="left-bottom">
            <h5>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</h5>
            <h5>Quasi ipsum dolor sit amet consectetur elit.</h5>
            <h5>Lorem ipsum dolor sit amet consectetur.</h5>
        </div>
        <div class="right">
            <img src="https://images.unsplash.com/photo-1587944214730-0b9f98b4ccb0?q=80&w=1887&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Car Image">
        </div>
        <div id="arrow"><i class="ri-arrow-right-line"></i></div>
    </div>

    <script>
        const projects = [
            { name: "Home Page", link: "#" },
            { name: "Portfolio", link: "#" },
            { name: "Cars Week - ©2023", link: "#" },
            { name: "News/Article", link: "#" },
            { name: "Contact", link: "#" }
        ];

        const menuList = document.getElementById('menuList');
        projects.forEach(project => {
            const listItem = document.createElement('li');
            listItem.innerHTML = `<a href="${project.link}" target="_blank">${project.name}</a>`;
            menuList.appendChild(listItem);
        });
    </script>
</body>
</html>
